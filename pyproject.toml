[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "blink"
version = "3.0.0"
description = "Blink v3 broken-link crawler foundation"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "typer>=0.12.0",
  "jsonschema>=4.22.0",
  "playwright>=1.52.0",
  "loguru>=0.7.0",
  "rich>=13.0.0",
  "trafilatura>=1.8.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
]

[project.scripts]
blink = "app.cli.main:app"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
