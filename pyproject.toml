[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "blink"
version = "3.0.0"
description = "Blink v3 broken-link crawler foundation"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "typer>=0.12.0",
  "jsonschema>=4.22.0",
  "playwright>=1.52.0",
  "loguru>=0.7.0",
  "rich>=13.0.0",
  "lxml_html_clean>=0.4.0",
  "trafilatura>=1.8.0",
  "starlette>=0.37.0",
  "python-multipart>=0.0.9",
  "uvicorn[standard]>=0.30.0",
  "apscheduler>=3.10.0",
  "croniter>=2.0.0",
  "httpx>=0.27.0",
  "argon2-cffi>=23.1.0",
  "itsdangerous>=2.1.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
]

[project.scripts]
blink = "app.cli.main:app"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
